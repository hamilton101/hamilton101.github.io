<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI-enabled digital twin for infrastructure monitoring</title>
  <desc id="desc">A physical bridge and its luminous digital counterpart are connected to environmental sensors and an artificial-intelligence network.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081d36"/>
      <stop offset="0.58" stop-color="#14526c"/>
      <stop offset="1" stop-color="#81b9af"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#28788a"/>
      <stop offset="1" stop-color="#082941"/>
    </linearGradient>
    <linearGradient id="digital" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78ffe0"/>
      <stop offset="1" stop-color="#50a3ff"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#83f6de" stroke-width="1" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <path d="M0 520 L170 385 315 485 470 360 625 490 790 385 970 500 1165 350 1350 475 1600 315 1600 600 0 600Z" fill="#a8d1c5" opacity="0.7"/>
  <path d="M0 575 L195 455 325 520 475 415 635 525 800 445 970 540 1170 415 1360 525 1600 390 1600 620 0 620Z" fill="#477d79" opacity="0.78"/>
  <rect y="585" width="1600" height="315" fill="url(#water)"/>

  <g id="bridge">
    <path d="M90 585 C385 435 655 435 950 585 C1170 685 1370 670 1540 575" fill="none" stroke="#d6e5e2" stroke-width="25"/>
    <path d="M90 585 C385 435 655 435 950 585 C1170 685 1370 670 1540 575" fill="none" stroke="#394f5c" stroke-width="11"/>
    <path d="M250 535 V760 M770 535 V780 M1180 635 V815" stroke="#d6e5e2" stroke-width="30"/>
    <path d="M250 535 V760 M770 535 V780 M1180 635 V815" stroke="#415a64" stroke-width="13"/>
    <path d="M225 755 H280 M742 776 H800 M1148 810 H1215" stroke="#d9eeea" stroke-width="16"/>
  </g>

  <g transform="translate(30 -185)" opacity="0.65" filter="url(#glow)" fill="none" stroke="url(#digital)">
    <path d="M90 585 C385 435 655 435 950 585 C1170 685 1370 670 1540 575" stroke-width="9"/>
    <path d="M250 535 V760 M770 535 V780 M1180 635 V815" stroke-width="7"/>
    <path d="M250 535 L385 467 L520 452 L655 482 L770 535 M770 535 L950 585 L1060 625 L1180 635 M1180 635 L1365 655 L1540 575" stroke-width="3" stroke-dasharray="13 13"/>
  </g>

  <g stroke="#78ffe0" fill="#092941" filter="url(#glow)">
    <circle cx="280" cy="530" r="12" stroke-width="5"/>
    <circle cx="520" cy="475" r="12" stroke-width="5"/>
    <circle cx="790" cy="535" r="12" stroke-width="5"/>
    <circle cx="1040" cy="620" r="12" stroke-width="5"/>
    <circle cx="1360" cy="640" r="12" stroke-width="5"/>
  </g>

  <g transform="translate(1210 90)">
    <circle cx="145" cy="145" r="117" fill="#082740" stroke="#77fce0" stroke-width="6" opacity="0.92"/>
    <circle cx="145" cy="145" r="86" fill="none" stroke="#4fa8ff" stroke-width="3" stroke-dasharray="8 10"/>
    <g stroke="#86ffe4" stroke-width="5">
      <path d="M86 102 L145 72 207 108 202 178 142 216 82 176Z" fill="none"/>
      <path d="M86 102 L142 145 207 108 M142 145 L202 178 M142 145 L82 176 M142 145 L145 72"/>
    </g>
    <g fill="#ffffff">
      <circle cx="86" cy="102" r="8"/><circle cx="145" cy="72" r="8"/>
      <circle cx="207" cy="108" r="8"/><circle cx="202" cy="178" r="8"/>
      <circle cx="142" cy="216" r="8"/><circle cx="82" cy="176" r="8"/>
      <circle cx="142" cy="145" r="10"/>
    </g>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M280 530 C530 235 870 245 1285 210" stroke="#76f7dd" stroke-width="4" stroke-dasharray="10 14" opacity="0.7"/>
    <path d="M790 535 C940 330 1100 300 1295 245" stroke="#55b8ff" stroke-width="4" stroke-dasharray="10 14" opacity="0.75"/>
    <path d="M1040 620 C1135 435 1240 375 1320 290" stroke="#8dfbe5" stroke-width="4" stroke-dasharray="10 14" opacity="0.65"/>
  </g>

  <g transform="translate(105 125)" fill="#b8ffe9" opacity="0.9">
    <path d="M0 92 C45 12 112 12 155 92 C108 76 48 76 0 92Z"/>
    <rect x="71" y="82" width="14" height="75" rx="7"/>
    <path d="M77 115 C28 102 18 132 0 162 C46 160 67 145 77 115Z"/>
    <path d="M80 120 C126 98 150 126 170 150 C128 156 99 145 80 120Z"/>
  </g>

  <g stroke="#9cfce8" stroke-width="3" opacity="0.46">
    <path d="M40 730 H560 M980 725 H1510"/>
    <path d="M100 785 H450 M1080 790 H1430"/>
    <path d="M560 835 H980"/>
  </g>
</svg>
