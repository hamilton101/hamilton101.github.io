<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ship navigating Arctic sea ice</title>
  <desc id="desc">A research vessel travels through an icy Arctic seascape beneath a green aurora.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071d35"/>
      <stop offset="0.62" stop-color="#12445a"/>
      <stop offset="1" stop-color="#66a5aa"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e7887"/>
      <stop offset="1" stop-color="#092b45"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7bf0b2" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#7bf0b2" stop-opacity="0.8"/>
      <stop offset="0.7" stop-color="#b4ffce" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7bf0b2" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <path d="M-80 230 C260 30 430 320 760 120 S1270 230 1680 35" fill="none" stroke="url(#aurora)" stroke-width="105" filter="url(#soft)"/>
  <path d="M-80 235 C260 40 430 320 760 125 S1270 235 1680 40" fill="none" stroke="url(#aurora)" stroke-width="24" opacity="0.8"/>

  <path d="M0 510 L180 380 330 475 515 325 695 488 885 360 1080 492 1280 345 1450 465 1600 385 1600 590 0 590Z" fill="#d7eef0" opacity="0.82"/>
  <path d="M0 525 L190 420 330 505 515 375 695 515 885 405 1080 520 1280 390 1450 500 1600 425 1600 590 0 590Z" fill="#86b9c2" opacity="0.75"/>
  <rect y="540" width="1600" height="360" fill="url(#sea)"/>

  <path d="M0 670 L300 610 470 655 310 735 0 770Z" fill="#dff5f5"/>
  <path d="M70 675 L300 630 420 658 280 710 80 725Z" fill="#a9d8dc"/>
  <path d="M1110 620 L1600 565 1600 765 1360 725 1215 680Z" fill="#e5f7f5"/>
  <path d="M1215 640 L1600 600 1600 720 1370 697Z" fill="#a9d8dc"/>
  <path d="M610 760 L865 700 1040 760 915 825 680 820Z" fill="#dff5f5"/>

  <g transform="translate(560 430)">
    <path d="M0 180 H540 L470 285 H95 L25 235Z" fill="#e7f0ef"/>
    <path d="M80 180 H520 L485 225 H55Z" fill="#e3543f"/>
    <path d="M160 65 H395 L455 180 H115Z" fill="#f4f7f4"/>
    <path d="M194 92 H360 L390 150 H165Z" fill="#143d55"/>
    <rect x="252" y="0" width="22" height="68" rx="3" fill="#dce9e7"/>
    <path d="M263 5 L355 52 H263Z" fill="#dce9e7"/>
    <rect x="346" y="40" width="12" height="35" fill="#e3543f"/>
    <circle cx="210" cy="120" r="8" fill="#79d7c5"/>
    <circle cx="250" cy="120" r="8" fill="#79d7c5"/>
    <circle cx="290" cy="120" r="8" fill="#79d7c5"/>
    <circle cx="330" cy="120" r="8" fill="#79d7c5"/>
  </g>

  <path d="M500 760 C650 720 740 720 865 700" fill="none" stroke="#b7e7e5" stroke-width="18" opacity="0.5"/>
  <path d="M500 790 C650 750 750 750 900 715" fill="none" stroke="#e0f6f3" stroke-width="7" opacity="0.65"/>
</svg>
