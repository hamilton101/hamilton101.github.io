<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Holographic video represented by multiple light-field views</title>
  <desc id="desc">A luminous three-dimensional object appears across layered video frames and projects directional rays toward a display.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d27"/>
      <stop offset="0.55" stop-color="#152b55"/>
      <stop offset="1" stop-color="#0b6a78"/>
    </linearGradient>
    <radialGradient id="orb" cx="36%" cy="30%" r="72%">
      <stop offset="0" stop-color="#fff59d"/>
      <stop offset="0.25" stop-color="#52f4d0"/>
      <stop offset="0.64" stop-color="#4c8dff"/>
      <stop offset="1" stop-color="#8d4dff"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8cfde5" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#448dff" stop-opacity="0.07"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="210" cy="125" r="2" fill="#bafcff"/>
  <circle cx="360" cy="220" r="3" fill="#bafcff" opacity="0.75"/>
  <circle cx="1260" cy="145" r="3" fill="#bafcff"/>
  <circle cx="1450" cy="300" r="2" fill="#bafcff" opacity="0.7"/>
  <circle cx="1320" cy="720" r="2" fill="#bafcff" opacity="0.65"/>

  <g fill="url(#screen)" stroke="#8ef8ea" stroke-width="4">
    <path d="M220 165 L830 110 830 660 220 735Z" opacity="0.38"/>
    <path d="M330 195 L940 145 940 685 330 750Z" opacity="0.48"/>
    <path d="M440 225 L1050 185 1050 705 440 765Z" opacity="0.62"/>
  </g>

  <g opacity="0.75" stroke="#71e9dc" stroke-width="2">
    <path d="M250 260 L800 210"/><path d="M250 350 L800 305"/>
    <path d="M250 440 L800 400"/><path d="M250 530 L800 495"/>
    <path d="M250 620 L800 590"/>
    <path d="M360 250 L910 205"/><path d="M360 345 L910 305"/>
    <path d="M360 440 L910 405"/><path d="M360 535 L910 505"/>
    <path d="M360 630 L910 605"/>
  </g>

  <g transform="translate(690 445)" filter="url(#glow)">
    <ellipse rx="150" ry="150" fill="#4beacf" opacity="0.15" filter="url(#soft)"/>
    <path d="M0-150 C95-132 158-68 145 20 C130 110 58 158-25 146 C-118 132-165 58-145-30 C-126-116-78-160 0-150Z" fill="url(#orb)"/>
    <path d="M-105-72 C-20-15 35-130 110-55 C45-35 48 72-65 105 C-28 35-104 12-105-72Z" fill="#111d58" opacity="0.42"/>
    <path d="M-95 52 C-22 5 26 96 105 40" fill="none" stroke="#d2fff6" stroke-width="10" opacity="0.8"/>
    <ellipse cx="-35" cy="-55" rx="45" ry="25" fill="#ffffff" opacity="0.25" transform="rotate(-25)"/>
  </g>

  <g stroke-linecap="round" fill="none">
    <path d="M820 350 L1335 205" stroke="#56f1cf" stroke-width="7" opacity="0.8"/>
    <path d="M840 420 L1380 345" stroke="#54baff" stroke-width="7" opacity="0.8"/>
    <path d="M835 500 L1395 500" stroke="#9b73ff" stroke-width="7" opacity="0.8"/>
    <path d="M800 575 L1370 660" stroke="#ff70d5" stroke-width="7" opacity="0.75"/>
  </g>

  <g transform="translate(1300 145)">
    <path d="M0 0 L190 42 190 610 0 650Z" fill="#091529" stroke="#b9fff2" stroke-width="7"/>
    <path d="M24 42 L165 72 165 575 24 606Z" fill="url(#screen)" stroke="#4ad8d1" stroke-width="3"/>
    <g fill="#87f8e2">
      <circle cx="55" cy="225" r="8"/><circle cx="95" cy="220" r="8"/><circle cx="135" cy="215" r="8"/>
      <circle cx="55" cy="280" r="8"/><circle cx="95" cy="275" r="8"/><circle cx="135" cy="270" r="8"/>
      <circle cx="55" cy="335" r="8"/><circle cx="95" cy="330" r="8"/><circle cx="135" cy="325" r="8"/>
      <circle cx="55" cy="390" r="8"/><circle cx="95" cy="385" r="8"/><circle cx="135" cy="380" r="8"/>
    </g>
  </g>

  <path d="M80 805 H1510" stroke="#86f5e4" stroke-width="2" opacity="0.32"/>
</svg>
